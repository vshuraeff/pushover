version: 2

release:
  prerelease: auto

builds:
  - id: povr
    main: ./cmd/povr
    binary: povr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/vshuraeff/pushover/internal/cli.Version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: 'povr_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

nfpms:
  - ids:
      - povr
    package_name: povr
    formats:
      - deb
    bindir: /usr/bin
    maintainer: Valentin Shuraeff <325606+vshuraeff@users.noreply.github.com>
    description: Command-line client for the Pushover API.
    license: MIT
    homepage: https://github.com/vshuraeff/pushover
    contents:
      - src: LICENSE
        dst: /usr/share/doc/povr/copyright

dockers_v2:
  - id: povr
    ids:
      - povr
    dockerfile: Dockerfile
    images:
      - ghcr.io/vshuraeff/povr
    tags:
      - '{{ .Version }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/vshuraeff/pushover
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.description: Unofficial Pushover CLI client

checksum:
  name_template: checksums.txt

changelog:
  use: git

snapshot:
  version_template: '{{ .Version }}-next'
