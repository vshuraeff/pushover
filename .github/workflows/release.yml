name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make test
      - run: make e2e

  release:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vshuraeff/homebrew-povr
          ref: master
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-povr
      - name: Update formula
        working-directory: homebrew-povr
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || exit 1
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease tag ${TAG}, skipping formula bump"
            exit 0
          fi
          actual="$(git ls-remote https://github.com/vshuraeff/pushover "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ -z "$actual" ]]; then
            actual="$(git ls-remote https://github.com/vshuraeff/pushover "refs/tags/${TAG}" | cut -f1)"
          fi
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "tag ${TAG} no longer points at the triggering commit (expected ${EXPECTED_SHA}, got ${actual:-<none>}); aborting" >&2
            exit 1
          fi
          url="https://github.com/vshuraeff/pushover/archive/refs/tags/${TAG}.tar.gz"
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl -fsSL "$url" -o "$archive"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"

          apply_bump() {
            sed -i \
              -e "s#^  url \"https://github.com/vshuraeff/pushover/archive/refs/tags/v[^\"]*\\.tar\\.gz\"\$#  url \"${url}\"#" \
              -e "s#^  sha256 \"[[:xdigit:]]\\{64\\}\"\$#  sha256 \"${sha256}\"#" \
              Formula/povr.rb
            grep -qF "url \"${url}\"" Formula/povr.rb && grep -qF "sha256 \"${sha256}\"" Formula/povr.rb || { echo "formula patterns did not match"; exit 1; }
            git diff --quiet && exit 0
            git add Formula/povr.rb
            git commit -m "povr ${TAG}"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_bump

          for attempt in 1 2 3; do
            git push origin HEAD:master && exit 0
            echo "push attempt ${attempt} failed, refreshing and retrying..." >&2
            git rebase --abort 2>/dev/null || true
            git fetch origin master
            git reset --hard origin/master
            apply_bump
          done
          echo "failed to push formula bump after 3 attempts" >&2
          exit 1
